<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stellantis Activities Summary</title>
<style>
  :root{
    --navy-dark:#0d2847;
    --navy:#173f72;
    --blue:#2f6fd6;
    --blue-light:#e8f0fd;
    --green:#1f9d55;
    --green-bg:#e7f7ee;
    --red:#e5484d;
    --red-bg:#fdecec;
    --orange:#e8a33d;
    --gray:#6b7688;
    --gray-light:#f4f6f9;
    --border:#e3e8f0;
    --card-bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:var(--gray-light);
    color:#1c2733;
  }
  .header{
    background:linear-gradient(115deg,#0d2847 0%,#123863 30%,#2f6fd6 55%,#1c4b85 75%,#0d2847 100%);
    padding:22px 34px;
    display:flex;
    align-items:center;
    gap:16px;
    border-top:4px solid #0a1c33;
  }
  .logo-badge{
    background:#ffffff;
    border-radius:6px;
    padding:6px 10px;
    display:flex;
    align-items:center;
    gap:2px;
    font-weight:800;
    font-size:15px;
    color:#1c2733;
  }
  .logo-badge .dot{
    width:8px;height:8px;background:#e5484d;border-radius:50%;
    display:inline-block;margin-right:4px;
  }
  .logo-text{color:#ffffff;}
  .logo-text h1{margin:0;font-size:19px;font-weight:700;}
  .logo-text p{margin:2px 0 0;font-size:12px;color:#c7d3e6;font-weight:400;}

  .subbar{
    background:linear-gradient(115deg,#0d2847 0%,#123863 30%,#2f6fd6 55%,#1c4b85 75%,#0d2847 100%);
    padding:10px 34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .subbar .crumbs{
    color:#ffffff;
    font-size:13px;
    font-weight:700;
  }
  .subbar .credit{
    color:#ffffff;
    font-size:13px;
    font-weight:700;
  }

  .filter-bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 34px 0;
    flex-wrap:wrap;
  }
  .filter-label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:700;
    margin-right:6px;
  }
  .filter-btn{
    border:1px solid var(--border);
    background:#fff;
    color:#3a4a5e;
    padding:8px 16px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
  }
  .filter-btn:hover{border-color:var(--blue);color:var(--blue);}
  .filter-btn.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }

  .section-title{
    padding:26px 34px 10px;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:700;
  }

  .kpi-row{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    padding:0 34px;
  }
  @media (max-width:1300px){
    .kpi-row{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:700px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
  }
  .kpi-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-top:3px solid var(--blue);
    border-radius:6px;
    padding:12px 14px;
  }
  .kpi-card.green{border-top-color:var(--green);}
  .kpi-card.red{border-top-color:var(--red);}
  .kpi-card .period{
    display:none;
  }
  .kpi-card .label{
    font-size:11.5px;
    color:#3a4a5e;
    margin-top:0;
    font-weight:600;
  }
  .kpi-card .value{
    font-size:22px;
    font-weight:800;
    color:#12233d;
    margin-top:4px;
  }
  .kpi-card .sub{
    font-size:10.5px;
    color:var(--gray);
    margin-top:4px;
  }
  .kpi-card .sub b{color:#3a4a5e;}
  .kpi-card .delta{
    font-size:10.5px;
    color:var(--green);
    font-weight:700;
    margin-top:2px;
  }

  .funnels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    padding:14px 34px 34px;
  }
  @media (max-width:900px){
    .funnels{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:600px){
    .funnels{grid-template-columns:1fr;}
  }
  .funnel-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:6px;
    padding:16px 18px 18px;
  }
  .funnel-card h3{
    margin:0;
    font-size:14.5px;
    color:#12233d;
  }
  .funnel-card .subtitle{
    font-size:11px;
    color:var(--gray);
    margin:2px 0 12px;
  }
  .bar-row{
    margin-bottom:9px;
  }
  .bar-row .bar-label{
    display:flex;
    font-size:12px;
    color:#3a4a5e;
    margin-bottom:3px;
    font-weight:600;
  }
  .bar-track{
    background:var(--gray-light);
    border-radius:4px;
    height:22px;
    width:100%;
    overflow:hidden;
    position:relative;
  }
  .bar-fill{
    height:100%;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding-right:8px;
    white-space:nowrap;
    min-width:78px;
  }
  .bar-fill.total{background:var(--blue);}
  .bar-fill.answered{background:#5b8fe0;}
  .bar-fill.booked{background:var(--green);}
  .bar-fill.notbooked{background:var(--red);}

  .reasons-title{
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:700;
    margin:16px 0 8px;
  }
  .reason-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .reason-name{
    font-size:11.5px;
    color:#3a4a5e;
    width:150px;
    flex-shrink:0;
    text-align:right;
    padding-right:6px;
  }
  .reason-bar-track{
    flex:1;
    background:var(--gray-light);
    border-radius:3px;
    height:9px;
    overflow:hidden;
  }
  .reason-bar-fill{
    height:100%;
    background:var(--orange);
    border-radius:3px;
  }
  .reason-value{
    font-size:11.5px;
    font-weight:700;
    color:#12233d;
    width:24px;
    text-align:left;
  }

  .footer-note{
    padding:0 34px 30px;
    font-size:11px;
    color:var(--gray);
  }
</style>
</head>

function pct(a,b){ return b>0 ? Math.round((a/b)*100) : 0; }
function fmt(n){ return n.toLocaleString('en-US'); }

function renderKPIs(d){
  const w=d.website, p=d.pms, k=d.km1, l=d.lost, s=d.salesforce, d1=d.d1;
  const cards = [
    {label:"Website", value:w.total, sub:`${fmt(w.answered)} answered (${pct(w.answered,w.total)}%)`, delta:`${fmt(w.bookedYes)} booked (${pct(w.bookedYes,w.answered)}%)`, cls:""},
    {label:"PMS Reminder", value:p.total, sub:`${fmt(p.answered)} answered (${pct(p.answered,p.total)}%)`, delta:`${fmt(p.bookedYes)} booked (${pct(p.bookedYes,p.answered)}%)`, cls:"green"},
    {label:"1km Service", value:k.total, sub:`${fmt(k.answered)} answered (${pct(k.answered,k.total)}%)`, delta:`${fmt(k.bookedYes)} booked (${pct(k.bookedYes,k.answered)}%)`, cls:""},
    {label:"Lost Customers", value:l.total, sub:`${fmt(l.answered)} answered (${pct(l.answered,l.total)}%)`, delta:`${fmt(l.bookedYes)} booked (${pct(l.bookedYes,l.answered)}%)`, cls:"red"},
    {label:"Salesforce", value:s.total, sub:`${fmt(s.closedWon)} closed won (${pct(s.closedWon,s.total)}%)`, delta:`${fmt(s.closedLost)} closed lost (${pct(s.closedLost,s.total)}%)`, cls:"green"}
  ];
  if(d1){
    const satYes = d1.satisfiedYes + (d1.altYes||0);
    cards.push({label:"D+1", value:d1.total, sub:`${fmt(d1.responded)} responded (${pct(d1.responded,d1.total)}%)`, delta:`${fmt(satYes)} satisfied (${pct(satYes,d1.attTotal)}%)`, cls:"green"});
  }
  document.getElementById('kpiRow').innerHTML = cards.map(c => `
    <div class="kpi-card ${c.cls}">
      <div class="period">${d.label.toUpperCase()}</div>
      <div class="label">${c.label}</div>
      <div class="value">${fmt(c.value)}</div>
      <div class="sub">${c.sub}</div>
      <div class="delta">↑ ${c.delta}</div>
    </div>
  `).join('');
}

function funnelCard(title, subtitle, section){
  const maxReason = Math.max(...section.reasons.map(r=>r[1]),1);
  const barMax = section.total;
  return `
    <div class="funnel-card">
      <h3>${title}</h3>
      <div class="subtitle">${subtitle}</div>
      <div class="bar-row">
        <div class="bar-label"><span>Total</span></div>
        <div class="bar-track"><div class="bar-fill total" style="width:100%">${fmt(section.total)}</div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Answered</span></div>
        <div class="bar-track"><div class="bar-fill answered" style="width:${pct(section.answered,barMax)}%">${fmt(section.answered)} (${pct(section.answered,barMax)}%)</div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Booked</span></div>
        <div class="bar-track"><div class="bar-fill booked" style="width:${pct(section.bookedYes,section.answered)}%">${fmt(section.bookedYes)} (${pct(section.bookedYes,section.answered)}%)</div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Not Booked</span></div>
        <div class="bar-track"><div class="bar-fill notbooked" style="width:${pct(section.bookedNo,section.answered)}%">${fmt(section.bookedNo)} (${pct(section.bookedNo,section.answered)}%)</div></div>
      </div>
      <div class="reasons-title">Reasons Not Booked</div>
      ${section.reasons.map(r => `
        <div class="reason-row">
          <div class="reason-name">${r[0]}</div>
          <div class="reason-bar-track"><div class="reason-bar-fill" style="width:${pct(r[1],maxReason)}%"></div></div>
          <div class="reason-value">${r[1]}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function salesforceCard(title, subtitle, section){

  const barMax = section.total;
  return `
    <div class="funnel-card">

      <div class="bar-row">
        <div class="bar-label"><span>Total</span></div>

      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Closed Won</span></div>
        <div class="bar-track"><div class="bar-fill booked" style="width:${pct(section.closedWon,barMax)}%">${fmt(section.closedWon)} (${pct(section.closedWon,barMax)}%)</div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Closed Lost</span></div>
        <div class="bar-track"><div class="bar-fill notbooked" style="width:${pct(section.closedLost,barMax)}%">${fmt(section.closedLost)} (${pct(section.closedLost,barMax)}%)</div></div>
      </div>
      <div class="reasons-title">Close Lost Reasons</div>
      ${section.reasons.map(r => `
        <div class="reason-row">

          <div class="reason-value">${r[1]}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function d1Card(title, subtitle, section){
  if(!section){
    return `
    <div class="funnel-card">
      <h3>${title}</h3>
      <div class="subtitle">${subtitle}</div>
      <div style="color:var(--gray);font-size:12px;padding:24px 0;">No data available for this period.</div>
    </div>`;
  }
  const maxReason = Math.max(...section.reasonsNotSatisfied.map(r=>r[1]),1);
  const satYes = section.satisfiedYes + (section.altYes||0);
  const satNo = section.satisfiedNo + (section.altNo||0);
  const maxNotAttended = section.reasonsNotAttended ? Math.max(...section.reasonsNotAttended.map(r=>r[1]),1) : 1;
  return `
    <div class="funnel-card">
      <h3>${title}</h3>
      <div class="subtitle">${subtitle}</div>
      <div class="bar-row">
        <div class="bar-label"><span>Total</span></div>
        <div class="bar-track"><div class="bar-fill total" style="width:100%">${fmt(section.total)}</div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Responded</span></div>
        <div class="bar-track"><div class="bar-fill answered" style="width:${pct(section.responded,section.total)}%">${fmt(section.responded)} (${pct(section.responded,section.total)}%)</div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Did Not Respond</span></div>
        <div class="bar-track"><div class="bar-fill notbooked" style="width:${pct(section.didNotRespond,section.total)}%">${fmt(section.didNotRespond)} (${pct(section.didNotRespond,section.total)}%)</div></div>
      </div>
      <div class="reasons-title">Customer Attended</div>
      <div class="bar-row">
        <div class="bar-label"><span>Yes</span></div>
        <div class="bar-track"><div class="bar-fill booked" style="width:${pct(section.attYes,section.attTotal)}%">${fmt(section.attYes)} (${pct(section.attYes,section.attTotal)}%)</div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>No</span></div>
        <div class="bar-track"><div class="bar-fill notbooked" style="width:${pct(section.attNo,section.attTotal)}%">${fmt(section.attNo)} (${pct(section.attNo,section.attTotal)}%)</div></div>
      </div>
      ${section.reasonsNotAttended ? `
      <div class="reasons-title">Why Didn't Attend?</div>
      ${section.reasonsNotAttended.map(r => `
        <div class="reason-row">
          <div class="reason-name">${r[0]}</div>
          <div class="reason-bar-track"><div class="reason-bar-fill" style="width:${pct(r[1],maxNotAttended)}%"></div></div>
          <div class="reason-value">${r[1]}</div>
        </div>
      `).join('')}
      ` : ''}
      <div class="reasons-title">Satisfied (of Attended)</div>
      <div class="bar-row">
        <div class="bar-label"><span>Yes</span></div>
        <div class="bar-track"><div class="bar-fill booked" style="width:${pct(satYes,section.attTotal)}%">${fmt(satYes)} (${pct(satYes,section.attTotal)}%)</div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>No</span></div>
        <div class="bar-track"><div class="bar-fill notbooked" style="width:${pct(satNo,section.attTotal)}%">${fmt(satNo)} (${pct(satNo,section.attTotal)}%)</div></div>
      </div>
      <div class="reasons-title">If No, Why?</div>
      ${section.reasonsNotSatisfied.map(r => `
        <div class="reason-row">
          <div class="reason-name">${r[0]}</div>
          <div class="reason-bar-track"><div class="reason-bar-fill" style="width:${pct(r[1],maxReason)}%"></div></div>
          <div class="reason-value">${r[1]}</div>
        </div>
      `).join('')}
      ${section.rescheduledTotal ? `
      <div class="reasons-title">Rescheduled?</div>
      <div class="bar-row">
        <div class="bar-label"><span>Yes</span></div>
        <div class="bar-track"><div class="bar-fill booked" style="width:${pct(section.rescheduledYes,section.rescheduledTotal)}%">${fmt(section.rescheduledYes)} (${pct(section.rescheduledYes,section.rescheduledTotal)}%)</div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>No</span></div>
        <div class="bar-track"><div class="bar-fill notbooked" style="width:${pct(section.rescheduledNo,section.rescheduledTotal)}%">${fmt(section.rescheduledNo)} (${pct(section.rescheduledNo,section.rescheduledTotal)}%)</div></div>
      </div>
      ` : ''}
    </div>
  `;
}

function renderFunnels(d){
  document.getElementById('funnelsRow').innerHTML =
    funnelCard("Website", `Lead → Booked journey`, d.website) +
    salesforceCard("Salesforce", `Total CRM records`, d.salesforce) +
    funnelCard("PMS Reminder", `Call → Booked journey`, d.pms) +
    funnelCard("1km Service", `Call → Booked journey`, d.km1) +
    funnelCard("Lost Customers", `Call → Booked journey`, d.lost) +
    d1Card("D+1", `Call → Attended → Satisfied journey`, d.d1);
}

function render(period){
  const d = DATA[period];
  document.getElementById('kpiPeriod').textContent = `— ${d.label.toUpperCase()}`;
  renderKPIs(d);
  renderFunnels(d);
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.period===period);
  });
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>render(btn.dataset.period));
});

render('janAug');
</script>
