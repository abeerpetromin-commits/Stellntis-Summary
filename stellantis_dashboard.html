<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retention Activities Summary</title>
<style>
  :root{
    --navy-dark:#0d2847;
    --navy:#173f72;
    --blue:#2f6fd6;
    --blue-light:#e8f0fd;
    --green:#1f9d55;
    --green-bg:#e7f7ee;
    --red:#e5484d;
    --red-bg:#fdecec;
    --orange:#e8a33d;
    --gray:#6b7688;
    --gray-light:#f4f6f9;
    --border:#e3e8f0;
    --card-bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:var(--gray-light);
    color:#1c2733;
  }
  .header{
    background:linear-gradient(115deg,#0d2847 0%,#123863 30%,#2f6fd6 55%,#1c4b85 75%,#0d2847 100%);
    padding:22px 34px;
    display:flex;
    align-items:center;
    gap:16px;
    border-top:4px solid #0a1c33;
  }
  .logo-badge{
    background:#ffffff;
    border-radius:6px;
    padding:6px 10px;
    display:flex;
    align-items:center;
    gap:2px;
    font-weight:800;
    font-size:15px;
    color:#1c2733;
  }
  .logo-badge .dot{
    width:8px;height:8px;background:#e5484d;border-radius:50%;
    display:inline-block;margin-right:4px;
  }
  .logo-text{color:#ffffff;}
  .logo-text h1{margin:0;font-size:19px;font-weight:700;}
  .logo-text p{margin:2px 0 0;font-size:12px;color:#c7d3e6;font-weight:400;}

  .subbar{
    background:linear-gradient(115deg,#0d2847 0%,#123863 30%,#2f6fd6 55%,#1c4b85 75%,#0d2847 100%);
    padding:10px 34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .subbar .crumbs{
    color:#ffffff;
    font-size:13px;
    font-weight:700;
  }
  .subbar .credit{
    color:#ffffff;
    font-size:13px;
    font-weight:700;
  }

  .filter-bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 34px 0;
    flex-wrap:wrap;
  }
  .filter-label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:700;
    margin-right:6px;
  }
  .filter-btn{
    border:1px solid var(--border);
    background:#fff;
    color:#3a4a5e;
    padding:8px 16px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
  }
  .filter-btn:hover{border-color:var(--blue);color:var(--blue);}
  .filter-btn.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }

  .section-title{
    padding:26px 34px 10px;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:700;
  }

  .kpi-row{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:8px;
    padding:0 34px;
  }
  @media (max-width:1500px){
    .kpi-row{grid-template-columns:repeat(5,1fr);}
  }
  @media (max-width:900px){
    .kpi-row{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:600px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
  }
  .kpi-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-top:3px solid var(--blue);
    border-radius:6px;
    padding:8px 9px;
  }
  .kpi-card.green{border-top-color:var(--green);}
  .kpi-card.red{border-top-color:var(--red);}
  .kpi-card.orange{border-top-color:var(--orange);}
  .kpi-card.blue{border-top-color:var(--blue);}
  .kpi-card .period{
    display:none;
  }
  .kpi-card .label{
    font-size:9.5px;
    color:#3a4a5e;
    margin-top:0;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .kpi-card .value{
    font-size:16px;
    font-weight:800;
    color:#12233d;
    margin-top:3px;
  }
  .kpi-card .sub{
    font-size:8.5px;
    color:var(--gray);
    margin-top:3px;
  }
  .kpi-card .sub b{color:#3a4a5e;}
  .kpi-card .delta{
    font-size:8.5px;
    color:var(--green);
    font-weight:700;
    margin-top:2px;
  }

  .funnels{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    padding:14px 34px 34px;
    align-items:start;
  }
  @media (max-width:1200px){
    .funnels{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:600px){
    .funnels{grid-template-columns:1fr;}
  }
  .funnel-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-top:3px solid var(--blue);
    border-radius:6px;
    padding:16px 18px 18px;
  }
  .funnel-card.red{border-top-color:var(--red);}
  .funnel-card.orange{border-top-color:var(--orange);}
  .funnel-card.blue{border-top-color:var(--blue);}
  .funnel-card h3{
    margin:0;
    font-size:14.5px;
    color:#12233d;
  }
  .funnel-card .subtitle{
    font-size:11px;
    color:var(--gray);
    margin:2px 0 12px;
  }
  .bar-row{
    margin-bottom:9px;
  }
  .bar-row .bar-label{
    display:flex;
    font-size:12px;
    color:#3a4a5e;
    margin-bottom:3px;
    font-weight:600;
  }
  .bar-track{
    background:var(--gray-light);
    border-radius:4px;
    height:22px;
    width:100%;
    overflow:hidden;
    position:relative;
  }
  .bar-fill{
    height:100%;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding-right:8px;
    white-space:nowrap;
    min-width:78px;
  }
  .bar-fill.total{background:var(--blue);}
  .bar-fill.answered{background:#5b8fe0;}
  .bar-fill.booked{background:var(--green);}
  .bar-fill.notbooked{background:var(--red);}

  .reasons-title{
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gray);
    font-weight:700;
    margin:16px 0 8px;
  }
  .reason-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .reason-name{
    font-size:11.5px;
    color:#3a4a5e;
    width:150px;
    flex-shrink:0;
    text-align:right;
    padding-right:6px;
  }
  .reason-bar-track{
    flex:1;
    background:var(--gray-light);
    border-radius:3px;
    height:9px;
    overflow:hidden;
  }
  .reason-bar-fill{
    height:100%;
    background:var(--orange);
    border-radius:3px;
  }
  .reason-value{
    font-size:11.5px;
    font-weight:700;
    color:#12233d;
    width:24px;
    text-align:left;
  }

  .footer-note{
    padding:0 34px 30px;
    font-size:11px;
    color:var(--gray);
  }
</style>

<style>
  .status{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--gray);}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px var(--green-bg);}
  .live-dot.err{background:var(--red);box-shadow:0 0 0 3px var(--red-bg);}
  .live-dot.load{background:var(--orange);}
  .refresh-btn{border:1px solid var(--border);background:#fff;color:#3a4a5e;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;}
  .refresh-btn:hover{border-color:var(--blue);color:var(--blue);}
  .kpi-row.three{grid-template-columns:repeat(4,1fr);}
  @media (max-width:1000px){.kpi-row.three{grid-template-columns:repeat(2,1fr);}}
  .kpi-row.three .kpi-card{padding:14px 16px;}
  .kpi-row.three .kpi-card .label{font-size:12px;}
  .kpi-row.three .kpi-card .value{font-size:26px;}
  .kpi-row.three .kpi-card .sub,.kpi-row.three .kpi-card .delta{font-size:11.5px;}
  @media (max-width:700px){.kpi-row.three{grid-template-columns:1fr;}}
  .reason-name{width:170px;}
  .reason-value{width:34px;}
  .empty{color:var(--gray);font-size:12px;padding:6px 0;}
</style>
</head>

<div class="section-title">Key Performance Indicators</div>

<div class="subbar">
  <div class="crumbs">Stellantis&nbsp; &middot; &nbsp;Petromin Service&nbsp; &middot; &nbsp;Live Dashboard</div>
  <div class="credit">Created by Team Leader : Abeer Aljehani</div>
</div>

<script>
const SHEET_ID = "1aB2Uu84kShS3gdUMbqyaPD8pnhAYeyx3r7HDKjPtb8U";
const YEAR = new Date().getFullYear();
const REFRESH_MS = 5 * 60 * 1000;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// Each tab: gid + which column holds the date used for MTD
const SOURCES = {
  website: { gid: "0",         title: "Website Mopar", subtitle: "Lead → Booked journey", dateCols: ["Request Date"] },
  pms:     { gid: "689615837", title: "PMS Reminder", subtitle: "Call → Booked journey", dateCols: ["14 DYS SMS Date","30 DYS SMS Date"] },
  km1:     { gid: "797427725", title: "1km Service",  subtitle: "Call → Booked journey", dateCols: ["SMS Sending Date"] },
  lost:    { gid: "2029052705", title: "Lost Customers", subtitle: "Call → Booked journey", dateCols: ["Date Of input"] }
};

let RAW = {};          // key -> {header, rows}
let period = "ytd";

/* ---------- CSV ---------- */
function parseCSV(t){
  const rows=[]; let r=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ r.push(f); f=''; }
    else if(c==='\n'){ r.push(f); rows.push(r); r=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!=='' || r.length){ r.push(f); rows.push(r); }
  return rows;
}

async function fetchTab(gid){
  const bust = "&_=" + Date.now();
  const urls = [
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}${bust}`,
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&gid=${gid}${bust}`
  ];
  let lastErr;
  for(const u of urls){
    try{
      const res = await fetch(u, {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const rows = parseCSV(await res.text());
      if(rows.length < 2) throw new Error("empty");
      return { header: rows[0].map(h=>h.trim()), rows: rows.slice(1) };
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}

/* ---------- Dates ---------- */
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate(s){
  s=(s||"").trim(); if(!s) return null; let m;
  if(m=s.match(/^([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})/)){ const mo=MON[m[1].slice(0,3).toLowerCase()]; return mo?{y:+m[3],m:mo}:null; }
  if(m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/)){ const mo=MON[m[2].toLowerCase()]; let y=+m[3]; if(y<100) y+=2000; return mo?{y,m:mo}:null; }
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){ let y=+m[3]; if(y<100) y+=2000; const mo=+m[2]; return (mo>=1&&mo<=12)?{y,m:mo}:null; } // dd/mm/yyyy
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)) return {y:+m[1],m:+m[2]};
  return null;
}

/* ---------- Aggregation ---------- */
function col(header, re){ return header.findIndex(h => re.test(h)); }

function aggregate(key, mode){
  const src = SOURCES[key], d = RAW[key];
  const empty = {answered:0,noAnswer:0,total:0,bookedYes:0,bookedNo:0,reasons:[]};
  if(!d) return empty;
  const h = d.header;
  const si = col(h,/^status$/i), bi = col(h,/^booked\??$/i), ri = col(h,/^if\s*no/i);
  const di = src.dateCols.map(c => h.indexOf(c)).filter(i => i>=0);
  const now = new Date();
  let tgtY = YEAR, tgtM = now.getMonth()+1;
  if(mode==="prev"){ tgtM -= 1; if(tgtM===0){ tgtM=12; tgtY-=1; } }
  let a=0, n=0, y=0; const reasons = {};
  for(const r of d.rows){
    const s = (r[si]||"").trim().toLowerCase();
    const isAns = (s==="answered" || s==="answer");
    const isNo  = s.startsWith("no answer");
    if(!isAns && !isNo) continue;
    if(mode==="mtd" || mode==="prev"){
      let dt=null; for(const i of di){ dt=parseDate(r[i]); if(dt) break; }
      if(!dt || dt.y!==tgtY || dt.m!==tgtM) continue;
    }
    if(isNo){ n++; continue; }
    a++;
    const b = (r[bi]||"").trim().toLowerCase();
    if(b==="yes") y++;
    else if(b==="no"){
      const k = (r[ri]||"").trim();
      if(k){
        const ex = Object.keys(reasons).find(x => x.toLowerCase()===k.toLowerCase()) || k;
        reasons[ex] = (reasons[ex]||0) + 1;
      }
    }
  }
  return { answered:a, noAnswer:n, total:a+n, bookedYes:y, bookedNo:a-y,
           reasons: Object.entries(reasons).sort((p,q)=>q[1]-p[1]).slice(0,12) };
}

/* ---------- Render ---------- */
function pct(a,b){ return b>0 ? Math.round((a/b)*100) : 0; }
function fmt(n){ return n.toLocaleString('en-US'); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function kpiCard(title, s){
  return `
    <div class="kpi-card blue">
      <div class="label">${title}</div>
      <div class="value">${fmt(s.total)}</div>
      <div class="sub">${fmt(s.answered)} answered (${pct(s.answered,s.total)}%)</div>
      <div class="delta">↑ ${fmt(s.bookedYes)} booked (${pct(s.bookedYes,s.answered)}%)</div>
    </div>`;
}

function funnelCard(title, subtitle, s){
  const maxReason = Math.max(...s.reasons.map(r=>r[1]),1);
  return `
    <div class="funnel-card blue">
      <h3>${title}</h3>
      <div class="subtitle">${subtitle}</div>
      <div class="bar-row"><div class="bar-label"><span>Total</span></div>
        <div class="bar-track"><div class="bar-fill total" style="width:100%">${fmt(s.total)}</div></div></div>
      <div class="bar-row"><div class="bar-label"><span>Answered</span></div>
        <div class="bar-track"><div class="bar-fill answered" style="width:${pct(s.answered,s.total)}%">${fmt(s.answered)} (${pct(s.answered,s.total)}%)</div></div></div>
      <div class="bar-row"><div class="bar-label"><span>Booked</span></div>
        <div class="bar-track"><div class="bar-fill booked" style="width:${pct(s.bookedYes,s.answered)}%">${fmt(s.bookedYes)} (${pct(s.bookedYes,s.answered)}%)</div></div></div>
      <div class="bar-row"><div class="bar-label"><span>Not Booked</span></div>
        <div class="bar-track"><div class="bar-fill notbooked" style="width:${pct(s.bookedNo,s.answered)}%">${fmt(s.bookedNo)} (${pct(s.bookedNo,s.answered)}%)</div></div></div>
      <div class="reasons-title">Reasons Not Booked</div>
      ${s.reasons.length ? s.reasons.map(r => `
        <div class="reason-row">
          <div class="reason-name">${esc(r[0])}</div>
          <div class="reason-bar-track"><div class="reason-bar-fill" style="width:${pct(r[1],maxReason)}%"></div></div>
          <div class="reason-value">${r[1]}</div>
        </div>`).join('') : '<div class="empty">No reasons recorded.</div>'}
    </div>`;
}

function render(){
  const keys = Object.keys(SOURCES);
  const data = Object.fromEntries(keys.map(k => [k, aggregate(k, period)]));
  document.getElementById('kpiRow').innerHTML = keys.map(k => kpiCard(SOURCES[k].title, data[k])).join('');
  document.getElementById('funnelsRow').innerHTML = keys.map(k => funnelCard(SOURCES[k].title, SOURCES[k].subtitle, data[k])).join('');
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.period===period));
}

function setStatus(state, text){
  const dot = document.getElementById('liveDot');
  dot.className = 'live-dot' + (state==='ok' ? '' : ' ' + state);
  document.getElementById('statusText').textContent = text;
}

async function loadAll(){
  setStatus('load','Loading…');
  const keys = Object.keys(SOURCES);
  const results = await Promise.allSettled(keys.map(k => fetchTab(SOURCES[k].gid)));
  const failed = [];
  results.forEach((r,i) => { if(r.status==='fulfilled') RAW[keys[i]] = r.value; else failed.push(SOURCES[keys[i]].title); });
  render();
  const t = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  if(failed.length===keys.length) setStatus('err', 'Could not load data — check sheet sharing');
  else if(failed.length) setStatus('err', `Updated ${t} · failed: ${failed.join(', ')}`);
  else setStatus('ok', `Live · updated ${t}`);
}

document.getElementById('mtdBtn').textContent = 'MTD ' + MONTHS[new Date().getMonth()];
document.getElementById('prevBtn').textContent = MONTHS[(new Date().getMonth()+11)%12];
document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => { period = btn.dataset.period; render(); }));
document.getElementById('refreshBtn').addEventListener('click', loadAll);

render();
loadAll();
setInterval(loadAll, REFRESH_MS);
</script>
